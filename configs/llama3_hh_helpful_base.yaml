model:
  pretrained_model_name_or_path: "W-61/hh-helpful-base-llama3-8b-sft"
  # attn_implementation: "flash_attention_2"

dataset:
  dataset_name: "Anthropic/hh-rlhf"
  data_dir: "helpful-base"
  generated_data: false
  chat_template: true
  chat_template_name: "llama3"
  subset: "train[:100%]"
  eval_subset: null
  val_ratio: 0.1
  seed: 42
  max_len: 512

training_args:
  run_name: "llama3_hh_helpful_base"
  output_dir: "model_outputs/llama3_hh_helpful_base"
  bf16: True
  beta: 0.1
  epsilon: 0.01
  truncation_mode: "keep_end"
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: True
  learning_rate: 5e-7
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_length: 512
  num_train_epochs: 1
  logging_steps: 1
  report_to: "wandb"
  save_strategy: "epoch"
  save_total_limit: 1
  save_only_model: true
  seed: 42
  do_eval: true
  eval_strategy: "steps"
  eval_steps: 100
  per_device_eval_batch_size: 2
